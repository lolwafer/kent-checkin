<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kent打卡">
<title>Kent 前台打卡</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6f4; color: #223; padding-bottom: 40px; }
  header { background: #2e7d32; color: #fff; padding: 14px 16px; text-align: center; }
  header h1 { font-size: 20px; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  main { max-width: 560px; margin: 0 auto; padding: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .card h2 { font-size: 15px; color: #556; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .grid button { padding: 16px 6px; font-size: 19px; border: 1px solid #cdd; border-radius: 10px; background: #fff; }
  .grid button.sel { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  .bigbtn { display: block; width: 100%; padding: 18px; font-size: 22px; font-weight: 600; border: none; border-radius: 12px; color: #fff; margin-top: 12px; }
  .bigbtn.in { background: #2e7d32; }
  .bigbtn.out { background: #ef6c00; }
  .bigbtn:disabled { opacity: .55; }
  .msg { margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 16px; display: none; }
  .msg.ok { background: #e6f4e6; color: #1b5e20; display: block; }
  .msg.err { background: #fdecea; color: #b71c1c; display: block; }
  .msg.wait { background: #fff8e1; color: #795500; display: block; }
  .status { font-size: 15px; color: #556; margin-top: 8px; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  input, select { padding: 12px; font-size: 17px; border: 1px solid #ccd; border-radius: 8px; background: #fff; width: 100%; }
  input[type=month] { width: auto; }
  .btn { padding: 11px 16px; font-size: 16px; border: 1px solid #2e7d32; color: #2e7d32; background: #fff; border-radius: 8px; white-space: nowrap; }
  .btn.solid { background: #2e7d32; color: #fff; border: none; }
  .btn.sm { padding: 6px 10px; font-size: 13px; }
  .link { color: #667; font-size: 14px; background: none; border: none; text-decoration: underline; }
  footer { text-align: center; font-size: 12px; color: #99a; margin-top: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 7px 5px; border-bottom: 1px solid #eee; text-align: left; }
  th { color: #667; font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .flag { color: #c62828; font-size: 12px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .topbar b { font-size: 18px; }
  .emp-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eee; color: #667; }
  .badge.warn { background: #fdecea; color: #b71c1c; }
</style>
</head>
<body>
<header>
  <h1>Kent Senior Center 打卡</h1>
  <div class="sub">144-89 38th Ave, Flushing · 现场 164 尺内 · 早 7:00 — 下午 5:00</div>
</header>

<!-- 登录 -->
<main id="viewLogin" style="display:none">
  <div class="card">
    <h2>输入密码登录</h2>
    <input type="password" id="loginPw" placeholder="密码" autocomplete="current-password">
    <button class="bigbtn in" id="loginBtn">登录</button>
    <div class="msg" id="loginMsg"></div>
    <div class="status" style="margin-top:10px">密码找管理员要,输密码即登录。先「添加到主屏幕」再从桌面图标里登录,以后点图标直接打卡,一直免登录。</div>
  </div>
</main>

<!-- 打卡 -->
<main id="viewPunch" style="display:none">
  <div class="card">
    <div class="topbar"><b id="whoami"></b><button class="link" id="logoutBtn">退出登录</button></div>
    <div class="status" id="todayStatus"></div>
    <button class="bigbtn in" id="punchBtn"></button>
    <div class="msg" id="punchMsg"></div>
  </div>
  <div class="card">
    <div class="topbar"><h2 style="margin:0">本月我的记录</h2><button class="btn sm" id="fixToggle">申请修改</button></div>
    <table><thead><tr><th>日期</th><th>上班</th><th>下班</th><th class="num">小时</th></tr></thead>
    <tbody id="myBody"></tbody></table>
    <div id="fixForm" style="display:none;margin-top:10px;border-top:1px solid #eee;padding-top:8px">
      <div class="row"><label style="font-size:14px">日期</label><input type="date" id="fixDate" style="width:auto"></div>
      <div class="row"><label style="font-size:14px">上班</label><input type="time" id="fixIn" style="width:auto">
        <label style="font-size:14px">下班</label><input type="time" id="fixOut" style="width:auto"></div>
      <div class="row"><input id="fixReason" placeholder="原因(如:忘打卡)"></div>
      <div class="row"><button class="btn solid" id="fixSubmit">提交,等管理员批准</button></div>
      <div class="msg" id="fixMsg"></div>
    </div>
    <div id="myReqs" style="margin-top:8px"></div>
  </div>
</main>

<footer>
  <button class="link" id="adminEntry">管理员入口</button> · Kent 打卡 v2026-10-01
</footer>

<script>
const ZONES = [
  { name: 'Kent 中心', lat: 40.7638555, lng: -73.8196091, r: 50 },                    // 144-89 38th Ave, Flushing
  { name: 'Great Neck', lat: 40.7994795, lng: -73.7449667, r: 50, only: ['wafer'] },  // 3 Lawson Ln(仅 wafer)
];
const zonesFor = name => ZONES.filter(z => !z.only || z.only.includes(name));
const SB_URL = 'https://objoggkkfqzzkfnitjlb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iam9nZ2trZnF6emtmbml0amxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzQ5MjcsImV4cCI6MjA5OTc1MDkyN30.y_giQDWURvKJ_FgZTsBZru9NEs7QtDoBY2P_fl4M1vQ';

const sb = window.supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const ls = localStorage;

async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) throw new Error(error.message);
  return data;
}

function show(view) {
  for (const v of ['viewLogin', 'viewPunch'])
    $(v).style.display = v === view ? '' : 'none';
}
function setMsg(id, cls, text) { const m = $(id); m.className = 'msg ' + (cls || ''); m.textContent = text || ''; }

/* ---------- 登录 ---------- */
function renderLogin() { show('viewLogin'); }

$('loginBtn').onclick = async () => {
  const pw = $('loginPw').value;
  if (!pw) { setMsg('loginMsg', 'err', '请输入密码'); return; }
  $('loginBtn').disabled = true;
  setMsg('loginMsg', 'wait', '登录中…');
  try {
    const r = await rpc('kent_login_pw', { p_password: pw });
    $('loginBtn').disabled = false;
    if (!r.ok) { setMsg('loginMsg', 'err', r.err); return; }
    ls.kent_token = r.token; ls.kent_name = r.name;
    $('loginPw').value = '';
    setMsg('loginMsg', '', '');
    enterPunch();
  } catch (e) { setMsg('loginMsg', 'err', e.message); $('loginBtn').disabled = false; }
};

/* ---------- 打卡 ---------- */
function renderToday(punches) {
  const goingIn = !punches.length || punches[punches.length - 1].type === 'out';
  const b = $('punchBtn');
  b.textContent = goingIn ? '上班打卡 ▶' : '下班打卡 ■';
  b.className = 'bigbtn ' + (goingIn ? 'in' : 'out');
  b.disabled = false;
  $('todayStatus').textContent = punches.length
    ? '今天已打:' + punches.map(p => (p.type === 'in' ? '上班 ' : '下班 ') + p.hhmm).join(' · ')
    : '今天还没有打卡';
}

async function enterPunch() {
  show('viewPunch');
  $('whoami').textContent = ls.kent_name + ' 打卡';
  setMsg('punchMsg', '', '');
  try {
    const r = await rpc('kent_my_today', { p_token: ls.kent_token });
    if (!r.ok) { logout(); return; }
    renderToday(r.punches);
    loadMyMonth();
  } catch (e) { setMsg('punchMsg', 'err', e.message); }
}

const ymNow = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };

async function loadMyMonth() {
  try {
    const r = await rpc('kent_my_month', { p_token: ls.kent_token, p_month: ymNow() });
    if (!r.ok) return;
    const byDay = {};
    for (const x of r.punches) (byDay[x.d] = byDay[x.d] || []).push(x);
    let rows = '';
    for (const d of Object.keys(byDay).sort().reverse()) {
      let open = null;
      const pairs = [];
      for (const x of byDay[d]) {
        if (x.type === 'in') open = x;
        else if (open) { pairs.push([open, x]); open = null; }
      }
      if (open) pairs.push([open, null]);
      for (const [i, o] of pairs) {
        const h = o ? ((toMin(o.hhmm) - toMin(i.hhmm)) / 60).toFixed(2) : '';
        rows += `<tr><td>${d.slice(5)}</td><td>${i.hhmm}${i.manual ? '*' : ''}</td><td>${o ? o.hhmm + (o.manual ? '*' : '') : '<span class="flag">缺卡</span>'}</td><td class="num">${h || '—'}</td></tr>`;
      }
    }
    $('myBody').innerHTML = rows || '<tr><td colspan="4" style="color:#889">本月还没有记录</td></tr>';
    const stTxt = { pending: '⏳ 等管理员批准', approved: '✅ 已批准', rejected: '❌ 已拒绝' };
    $('myReqs').innerHTML = r.requests.map(q =>
      `<div style="font-size:13px;color:#556;padding:3px 0">修改申请 ${q.d.slice(5)} ${q.in}–${q.out}:${stTxt[q.status] || q.status}</div>`).join('');
  } catch (e) { /* 静默 */ }
}

$('fixToggle').onclick = () => {
  const f = $('fixForm');
  f.style.display = f.style.display === 'none' ? '' : 'none';
  if (!$('fixDate').value) $('fixDate').value = new Date().toISOString().slice(0, 10);
};

$('fixSubmit').onclick = async () => {
  const d = $('fixDate').value, ti = $('fixIn').value, to = $('fixOut').value, why = $('fixReason').value.trim();
  if (!d || !ti || !to) { setMsg('fixMsg', 'err', '请把日期和上下班时间填完整'); return; }
  $('fixSubmit').disabled = true;
  try {
    const r = await rpc('kent_request_fix', { p_token: ls.kent_token, p_date: d, p_in: ti, p_out: to, p_reason: why });
    $('fixSubmit').disabled = false;
    if (!r.ok) { setMsg('fixMsg', 'err', r.err); if (r.relogin) logout(); return; }
    setMsg('fixMsg', 'ok', '已提交,等管理员批准。');
    $('fixReason').value = '';
    loadMyMonth();
  } catch (e) { setMsg('fixMsg', 'err', e.message); $('fixSubmit').disabled = false; }
};

$('punchBtn').onclick = () => {
  const goingIn = $('punchBtn').classList.contains('in');
  $('punchBtn').disabled = true;
  setMsg('punchMsg', 'wait', '正在定位,请稍候…');
  if (!navigator.geolocation) { setMsg('punchMsg', 'err', '此设备不支持定位'); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    const here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const R = 6371000, r = x => x * Math.PI / 180;
    const distTo = z => Math.round(2 * R * Math.asin(Math.sqrt(Math.sin(r(z.lat - here.lat) / 2) ** 2 + Math.cos(r(here.lat)) * Math.cos(r(z.lat)) * Math.sin(r(z.lng - here.lng) / 2) ** 2)));
    const zones = zonesFor(ls.kent_name);
    let best = null;
    for (const z of zones) { const d = distTo(z); if (!best || d < best.d) best = { z, d }; }
    const dist = best.d;
    const ft = m => Math.round(m * 3.28084);
    const ftStr = m => m > 1609 ? (m / 1609.34).toFixed(1) + ' 英里' : ft(m) + ' 尺';
    if (dist > best.z.r) {
      setMsg('punchMsg', 'err', '你现在距离' + best.z.name + '约 ' + ftStr(dist) + ',不在打卡范围(' + ft(best.z.r) + ' 尺),打卡失败。');
      $('punchBtn').disabled = false; return;
    }
    try {
      const res = await rpc('kent_punch', { p_token: ls.kent_token, p_type: goingIn ? 'in' : 'out', p_lat: here.lat, p_lng: here.lng, p_dist: dist });
      if (!res.ok) { setMsg('punchMsg', 'err', res.err); if (res.relogin) { logout(); return; } $('punchBtn').disabled = false; return; }
      setMsg('punchMsg', 'ok', '✅ ' + (goingIn ? '上班' : '下班') + '打卡成功(距离 ' + ft(dist) + ' 尺)');
      renderToday(res.punches);
      loadMyMonth();
    } catch (e) { setMsg('punchMsg', 'err', e.message); $('punchBtn').disabled = false; }
  }, err => {
    setMsg('punchMsg', 'err', err.code === 1 ? '定位权限被拒。请在手机设置里允许本网页/浏览器使用定位。' : '定位失败,请重试。');
    $('punchBtn').disabled = false;
  }, { enableHighAccuracy: true, timeout: 20000 });
};

function logout() {
  if (ls.kent_token) rpc('kent_logout', { p_token: ls.kent_token }).catch(() => {});
  ls.removeItem('kent_token'); ls.removeItem('kent_name');
  renderLogin();
}
$('logoutBtn').onclick = () => { if (confirm('退出登录?下次要重新输密码。')) logout(); };

/* ---------- 管理员:2026-10-01 起搬到 /admin(工时表、补卡审批、签到表、每月工资表) ---------- */
$('adminEntry').onclick = () => { location.href = '/admin'; };
const toMin = hhmm => +hhmm.slice(0, 2) * 60 + +hhmm.slice(3, 5);

/* ---------- 启动 ---------- */
if (ls.kent_token) enterPunch(); else renderLogin();
</script>
</body>
</html>
